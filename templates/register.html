{% extends 'base.html' %}

{% block title %}Register - LearnTrack{% endblock %}

{% block content %}

<div class="login-page">

    <!-- Left Illustration -->
    <div class="study-left">
        <div class="book-stack">📚</div>
        <div class="pencil-box">✏️ ✏️ ✏️</div>
    </div>

    <!-- Registration Card -->
    <div class="login-card register-card">

        <div class="login-icon">
            🎓
        </div>

        <h1>Create Account</h1>

        <p class="login-subtitle">
            Register to start using LearnTrack.
        </p>

        <form method="POST">
            {% csrf_token %}

            <label for="full_name">Full Name</label>

            <div class="input-box">
                <span>♙</span>
                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your name"
                    pattern="[A-Za-z ]+"
                    title="Full Name should contain alphabets only"
                    required
                >
            </div>

            <label for="username">Username</label>

            <div class="input-box">
                <span>♙</span>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    pattern="[A-Za-z]+"
                    title="Username should contain alphabets only"
                    required
                >
            </div>

            <label for="email">Email</label>

            <div class="input-box">
                <span>✉️</span>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.com"
                    title="Email must contain @ and end with .com"
                    required
                >
            </div>

            <label for="password">Password</label>

            <div class="input-box">
                <span>🔒</span>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                    title="Password must be at least 8 characters and contain uppercase, lowercase, number and special character"
                    required
                >
            </div>

            <label for="confirm_password">Confirm Password</label>

            <div class="input-box">
                <span>🔒</span>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >
            </div>
            <label for="semester">Semester</label>

<div class="input-box">
    <span>🎓</span>
    <select id="semester" name="semester" required>
        <option value="">Select Semester</option>
        <option value="S1">Semester 1</option>
        <option value="S2">Semester 2</option>
    </select>
</div>

            <button type="submit" class="login-button">
                Create Account&nbsp; →
            </button>

        </form>

        <div class="login-divider">
            <span>Already have an account?</span>
        </div>

        <a href="{% url 'login' %}" class="register-link">
            Back to Login
        </a>

    </div>

    <!-- Right Illustration -->
    <div class="study-right">

        <div class="graduation">
            🎓
        </div>

        <div class="study-message">
            Plan<br>
            Learn<br>
            Progress<br>
            Succeed
        </div>

        <div class="paper-plane">
            ✈️
        </div>

    </div>

</div>

{% endblock %}
