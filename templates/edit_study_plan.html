{% extends 'base.html' %}

{% block title %}Edit Study Plan - LearnTrack{% endblock %}

{% block content %}

<div class="study-plan-page">

    <div class="study-plan-card">

        <div class="study-plan-icon">✏️</div>

        <h1>Edit Study Plan</h1>

        <p class="study-plan-subtitle">
            Update your exam date and daily study hours.
        </p>

        <form method="POST">
            {% csrf_token %}

            <label for="exam_date">Exam Date</label>

            <div class="plan-input">
                <span>📅</span>
                <input
                    type="date"
                    id="exam_date"
                    name="exam_date"
                    value="{{ study_plan.exam_date|date:'Y-m-d' }}"
                    required>
            </div>

            <label for="daily_hours">Daily Study Hours</label>

            <div class="plan-input">
                <span>⏱️</span>
                <input
                    type="number"
                    id="daily_hours"
                    name="daily_hours"
                    min="1"
                    max="24"
                    step="0.5"
                    value="{{ study_plan.daily_hours }}"
                    required>
            </div>

            <button type="submit" class="plan-button">
                Update Study Plan →
            </button>

        </form>

        <a href="{% url 'create_study_plan' %}" class="back-link">
            ← Back to Study Plan
        </a>

    </div>

</div>

{% endblock %}
