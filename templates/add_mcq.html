{% extends 'base.html' %}

{% block title %}Add MCQ - LearnTrack{% endblock %}

{% block content %}

<div class="dashboard">

    <div class="dashboard-header">
        <div>
            <h1>Add MCQ 📝</h1>
            <p>Create a module-wise assessment question.</p>
        </div>
    </div>

    <div class="card mcq-form-card">

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Module</label>
                <select name="module" required>
    {% for module in modules %}
        <option value="{{ module.id }}">
            Semester {{ module.syllabus.semester|slice:"1:" }} - Module {{ module.module_number }}
        </option>
    {% endfor %}
</select>
            </div>

            <div class="form-group">
                <label>Question</label>
                <textarea name="question"
                          rows="4"
                          placeholder="Enter your question"
                          required></textarea>
            </div>

            <div class="options-grid">

                <div class="form-group">
                    <label>Option 1</label>
                    <input type="text" name="option1" required>
                </div>

                <div class="form-group">
                    <label>Option 2</label>
                    <input type="text" name="option2" required>
                </div>

                <div class="form-group">
                    <label>Option 3</label>
                    <input type="text" name="option3" required>
                </div>

                <div class="form-group">
                    <label>Option 4</label>
                    <input type="text" name="option4" required>
                </div>

            </div>

            <div class="form-group">
                <label>Correct Answer</label>

                <select name="correct_answer" required>
                    <option value="">Select correct answer</option>
                    <option value="option1">Option 1</option>
                    <option value="option2">Option 2</option>
                    <option value="option3">Option 3</option>
                    <option value="option4">Option 4</option>
                </select>
            </div>

            <div style="margin-top:25px;">

                <button type="submit" class="dashboard-button">
                    Save Question
                </button>

                <a href="{% url 'question_bank' %}"
                   class="dashboard-button"
                   style="margin-left:10px;">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
