{% extends 'base.html' %}

{% block title %}Create Study Plan - LearnTrack{% endblock %}

{% block content %}

<div class="study-plan-page">

    <div class="study-plan-card">

        <div class="study-plan-icon">
            📅
        </div>

        <h1>Create Your Study Plan</h1>

        <p class="study-plan-subtitle">
            Enter your exam date and available daily study hours.
        </p>

        <form method="POST">

            {% csrf_token %}

            <label for="exam_date">Exam Date</label>

            <div class="plan-input">
                <span>📅</span>
                <input
                    type="date"
                    id="exam_date"
                    name="exam_date"
                    required
                >
            </div>

            <label for="daily_hours">Daily Study Hours</label>

            <div class="plan-input">
                <span>⏱️</span>
                <input
                    type="number"
                    id="daily_hours"
                    name="daily_hours"
                    min="1"
                    max="24"
                    step="0.5"
                    placeholder="Example: 3"
                    required
                >
            </div>

            <p class="plan-note">
                Enter the number of hours you can study each day.
            </p>

            <button type="submit" class="plan-button">
                Generate Study Plan →
            </button>

        </form>

        <a href="{% url 'dashboard' %}" class="back-link">
            ← Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}
